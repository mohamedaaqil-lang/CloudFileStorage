<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Cloud-Based File Storage System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
        </div>
        <span class="logo-text">Cloud<span>Vault</span></span>
      </a>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Already have an account? Sign In</a>
      </div>
    </div>
  </header>

  <!-- Signup Form Section -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Get started with your secure cloud file storage</p>
      </div>

      <!-- Alert Notification Area -->
      <div id="auth-alert" class="alert"></div>

      <form id="signup-form">
        <!-- Full Name -->
        <div class="form-group">
          <label for="signup-name" class="form-label">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="signup-name" class="form-input" placeholder="e.g. Alex Johnson" required autocomplete="name">
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="signup-email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="signup-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="signup-password" class="form-label">Password (Min. 6 characters)</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="signup-password" class="form-input" placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
            <button type="button" class="password-toggle" title="Toggle password visibility">👁️</button>
          </div>
          <div class="password-strength">
            <div id="strength-bar" class="strength-bar"></div>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="signup-confirm-password" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="signup-confirm-password" class="form-input" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password">
            <button type="button" class="password-toggle" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="signup-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In here</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
