<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Cloud-Based File Storage System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
        </div>
        <span class="logo-text">Cloud<span>Vault</span></span>
      </a>

      <div class="nav-actions">
        <a href="signup.html" class="btn btn-outline btn-sm">Don't have an account? Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Login Form Section -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your encrypted cloud files</p>
      </div>

      <!-- Alert Notification Box -->
      <div id="auth-alert" class="alert"></div>

      <form id="login-form">
        <!-- Email Address -->
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        New to CloudVault? <a href="signup.html">Create your account</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
